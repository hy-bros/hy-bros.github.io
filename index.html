<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HY BROTHERS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content='https://hy-bros.github.io/hy-bros.png' property='og:image' />
 <link href='https://hy-bros.github.io/hy-bros.png' rel='shortcut icon' type='image/vnd.microsoft.icon' />
 <link href='https://hy-bros.github.io/hy-bros.png' rel='apple-touch-icon' />
  <meta content='HY BROTHERS' property='og:site_name' />
 <meta content='HY BROTHERS' property='og:title' />
 <meta content='HY BROTHERS' name='title' />
 <meta content='website' property='og:type' />
 <meta content='We are a brotherly partnership of web designers and developers, dedicated to crafting elegant, functional digital experiences. Explore our portfolio of completed works.' property='og:description' />
 <meta content='We are a brotherly partnership of web designers and developers, dedicated to crafting elegant, functional digital experiences. Explore our portfolio of completed works.' name='description' />
 <meta content='HY BROTHERS, HYBROS, hybros, hy brothers, hybros github, hybrothers github, hybros github.io, harsh & yash, harsh, yash, asbros website, ascodeeditor, rtugames, rtutools, as chat, as music, as youtube, ascineplex, as cineplex' name='keywords' />
  <style>
    /* Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Poppins:wght@400;700&family=Jost&family=Sen&family=Lato:wght@300;400;700&display=swap');

    .josefin-font{font-family: 'Josefin Sans', sans-serif;}
    .poppins-font{font-family: 'Poppins', sans-serif;}
    .sen{font-family: "Sen", sans-serif;}
    .lato{font-family: "Lato", sans-serif;}

    /* Variables */
    :root{
      --red: #dc3545;
      --white: #ffffff;
      --black: #000000;
      --dark: #161a1d;
    }

    /* Base */
    body {
      margin: 0;
      font-family: 'Lato', sans-serif;
      background: var(--dark);
      color: var(--white);
    }

    /* --- UTILITY CLASSES --- */
    .flex { display: flex; align-items: center; }
    .justify-center { justify-content: center; }
    .right { margin-left: auto; }
    .center { text-align: center; }
    .middle { align-items: center; }
    .pad-15 { padding: 15px; }
    .margin-5 { margin: 5px; }
    .margin-10 { margin: 10px; }
    .bg-black { background-color: var(--black); }
    .bg-white { background-color: var(--white); }
    .bg-red { background-color: var(--red); }
    .white { color: var(--white); }
    .black { color: var(--black); }
    .f-14 { font-size: 14px; }
    .f-18 { font-size: 18px; }
    .f-20 { font-size: 20px; }
    .f-25 { font-size: 28px; }
    .bold { font-weight: 700; }
    .circle { border-radius: 50%; }
    .radius-5 { border-radius: 5px; }
    .radius-10 { border-radius: 10px; }
    .s-40 { width: 40px; height: 40px; object-fit: cover; }
    .s-120 { width: 120px; height: 120px; object-fit: cover; }
    .shadow { box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .drop-shadow { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .bg-blur { backdrop-filter: blur(10px); background: rgba(0,0,0,0.6); position: sticky; top: 0; z-index: 100; }

    /* Hero */
    .hero {
      background: url('https://hy-bros.github.io/hy-bros.png') center/cover no-repeat;
      height: 350px;
      position: relative;
    }
    .hero::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }

    /* Projects Grid */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .project {
      transition: transform 0.3s, box-shadow 0.3s;
      opacity: 0;
      transform: translateY(40px);
    }
    
    .project.show { animation: fadeInUp 0.8s ease forwards; }
    
    .btn {
      display: inline-block;
      padding: 10px 25px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="flex pad-15 shadow bg-blur">
    <h1 class="josefin-font f-20 white bold">HY BROTHERS</h1>
    <div class="flex right">
      <img class="s-40 circle drop-shadow margin-5" src="https://hy-bros.github.io/hy-bros.png" alt="HY-BROS">
    </div>
  </header>

  <section class="hero flex justify-center middle">
    <div class="center josefin-font white" style="z-index: 1;">
      <h1 class="poppins-font f-25">HY BROTHERS</h1>
      <h3 class="sen f-18">Harsh & Yash</h3>
    </div>
  </section>

  <main class="pad-15" style="padding-top: 50px;">
    <h2 class="poppins-font f-20 white center">Our Projects</h2>
    <div id="projects" class="projects pad-15">
        </div>
  </main>

  <footer class="bg-black pad-15 center white f-14">
    <p>&copy; 2026 HY BROTHERS | Crafted with passion</p>
  </footer>

  <script>
    // Fallback data if the fetch fails or the JSON is empty
    const dummyFallback = [
      {
        name: "Demo Project",
        about: "This is a placeholder because your JSON file is currently empty.",
        image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=250&q=80",
        url: "#"
      }
    ];

    async function loadProjects() {
      const container = document.getElementById("projects");
      
      try {
        const response = await fetch("https://hy-bros.github.io/index.json");
        let projects = await response.json();

        // If fetch works but array is empty, use fallback
        if (!projects || projects.length === 0) {
          projects = dummyFallback;
        }

        renderProjects(projects);
      } catch (error) {
        console.error("Fetch failed, loading fallback:", error);
        renderProjects(dummyFallback);
      }
    }

    function renderProjects(data) {
      const container = document.getElementById("projects");
      container.innerHTML = ""; // Clear loader/error

      data.forEach(p => {
        const card = document.createElement("div");
        card.className = "project pad-15 shadow radius-10 bg-white black center";
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" class="s-120 circle drop-shadow margin-10">
          <h3 class="poppins-font f-18 bold">${p.name}</h3>
          <p class="lato f-14" style="min-height: 40px;">${p.about}</p>
          <a href="${p.url}" target="_blank" class="btn bg-red white radius-5 bold margin-5">View Project</a>
        `;
        container.appendChild(card);
      });

      // Trigger animations
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("show");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll(".project").forEach(el => observer.observe(el));
    }

    loadProjects();
  </script>
</body>
</html>
